name: Deployment Readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository contract
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f vercel.json
          test -f SECURITY.md
          test -f .env.example
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"

      - name: Validate serverless function syntax
        shell: bash
        run: |
          set -euo pipefail
          find api -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check

      - name: Validate local JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          if [ -d src/js ]; then
            find src/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          fi

      - name: Validate environment template has no values
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^[A-Z][A-Z0-9_]*=.+$' .env.example; then
            echo '.env.example must contain names only, without secret values.' >&2
            exit 1
          fi

      - name: Prevent obvious committed secrets
        shell: bash
        run: |
          set -euo pipefail
          exclusions=( ':!*.md' ':!.env.example' ':!.github/workflows/deployment-readiness.yml' )
          fixed_markers=(
            'SUPABASE_SERVICE_ROLE_KEY='
            'VERCEL_TOKEN='
            'BEGIN RSA PRIVATE KEY'
            'BEGIN EC PRIVATE KEY'
            'BEGIN OPENSSH PRIVATE KEY'
          )
          for marker in "${fixed_markers[@]}"; do
            if git grep -nF "$marker" -- "${exclusions[@]}"; then
              echo "Potential secret marker detected: $marker" >&2
              exit 1
            fi
          done
          if git grep -nE 'AIza[0-9A-Za-z_-]{30,}|ya29\.[0-9A-Za-z_-]+' -- "${exclusions[@]}"; then
            echo 'Potential Google credential material detected.' >&2
            exit 1
          fi
